# Sandbox-only nginx main config (see docker-compose.base44.yml).
#
# Why this exists: the cloned repo is bind-mounted from the sandbox working copy,
# which is mode 0700 owned by root. The stock nginx:alpine image runs workers as
# the unprivileged `nginx` user, so every request failed with 403/404
# ("Permission denied" in the error log). Running the workers as root inside this
# throwaway, non-root-mapped sandbox container lets them traverse the mount.
# Nothing about the repository's own files or its production setup is changed.

user  root;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
