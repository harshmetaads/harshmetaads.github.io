# Sandbox-only nginx config for the Base44 preview (see docker-compose.base44.yml).
# The document root is the bind-mounted repo, so edits appear on the next request.
# The repo's own HTML/CSS/JS is served unmodified except for the preview CSP
# override in nginx.base44.preview.conf, which is only loaded when
# BASE44_PREVIEW_MODE=1.

# http-level, so the server/location blocks below inherit it (a location-level
# add_header would cancel inheritance).
add_header Cache-Control "no-store" always;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Byte-range requests (the promo/explainer <video> assets need them).
    location / {
        try_files $uri $uri/ =404;
    }
}
