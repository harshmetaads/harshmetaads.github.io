# Base44 preview-only nginx directives (http context).
#
# Activated by the `web` service command in docker-compose.base44.yml only when
# BASE44_PREVIEW_MODE is exactly "1"; otherwise this file is not loaded and the
# repo's own Content-Security-Policy meta tags are served untouched.
#
# WHY: every page in this repo ships a strict CSP meta tag (script-src 'self',
# optionally with inline-script sha256 hashes). It blocks the scripts Base44
# injects to run the preview - "Executing inline script violates ... script-src
# 'self'" and "Loading the script 'https://app.base44.com/builder-bridge.js'
# violates the following CSP directive" - so the preview panel never goes live
# and the app cannot be inspected from the builder.
#
# WHAT: in the preview sandbox only, the page's own CSP meta tag is neutralised
# (renamed to an inert http-equiv) and the equivalent policy is sent as a
# response header instead, extended with the Base44 bridge origin and
# 'unsafe-inline' (the bridge bootstrap is an inline script whose hash changes
# per session, so it cannot be pinned). All other directives, including
# form-action, base-uri and object-src, are preserved, and no frame-ancestors
# directive is added. Nothing in the repository changes, so the strict
# production policy on GitHub Pages is unaffected.

sub_filter_types text/html;
sub_filter_once off;
sub_filter "http-equiv=\"Content-Security-Policy\"" "http-equiv=\"X-Base44-Preview-Disabled-CSP\"";

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.base44.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://app.base44.com wss://app.base44.com; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
